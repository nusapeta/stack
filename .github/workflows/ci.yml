name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: actions/checkout@v7
        with:
          repository: nusapeta/route
          path: engines/route
      - uses: actions/checkout@v7
        with:
          repository: nusapeta/place
          path: engines/place
      - name: Build engine images
        uses: docker/build-push-action@v7
        with:
          context: engines/route
          load: true
          tags: nusapeta/route:ci
          cache-from: type=gha,scope=stack-route
          cache-to: type=gha,mode=max,scope=stack-route
      - name: Build place image
        uses: docker/build-push-action@v7
        with:
          context: engines/place
          load: true
          tags: nusapeta/place:ci
          cache-from: type=gha,scope=stack-place
          cache-to: type=gha,mode=max,scope=stack-place
      - name: Compose with fixtures
        env:
          DATA_DIR: ./data
          NUSAPETA_PORT: "8080"
          NUSAPETA_ROUTE_GRAPH: java-mini.graph
          NUSAPETA_PLACE_INDEX: places-mini.idx
          NUSAPETA_PLACE_MANIFEST: places-mini.idx.json
          NUSAPETA_ROUTE_IMAGE: nusapeta/route:ci
          NUSAPETA_PLACE_IMAGE: nusapeta/place:ci
        run: |
          scripts/bootstrap.sh --fixtures
          docker compose up -d --wait
      - name: Contract test
        run: BASE_URL=http://127.0.0.1:8080 scripts/e2e.sh
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 200
      - name: Stop
        if: always()
        run: docker compose down -v
