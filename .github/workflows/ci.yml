name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: nusapeta/route
          path: engines/route
      - uses: actions/checkout@v4
        with:
          repository: nusapeta/place
          path: engines/place
      - name: Build engine images
        run: |
          docker build -t nusapeta/route:ci engines/route
          docker build -t nusapeta/place:ci engines/place
      - name: Compose with fixtures
        env:
          DATA_DIR: ./data
          NUSAPETA_PORT: "8080"
          NUSAPETA_ROUTE_GRAPH: java-mini.graph
          NUSAPETA_PLACE_INDEX: places-mini.idx
          NUSAPETA_PLACE_MANIFEST: places-mini.idx.json
          NUSAPETA_ROUTE_IMAGE: nusapeta/route:ci
          NUSAPETA_PLACE_IMAGE: nusapeta/place:ci
        run: |
          scripts/bootstrap.sh --fixtures
          docker compose up -d --wait
      - name: Contract test
        run: BASE_URL=http://127.0.0.1:8080 scripts/e2e.sh
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 200
      - name: Stop
        if: always()
        run: docker compose down -v
